<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nenana Ice Classic Breakup Dates</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0ece4;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      justify-content: center;
      padding: 20px 16px 32px;
    }
    .chart-wrap {
      width: 100%;
      max-width: 500px;
    }
    .chart-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: #1a3028;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 3px;
    }
    .chart-subtitle {
      font-size: 0.7rem;
      color: #6b7c6e;
      text-align: center;
      font-style: italic;
      margin-bottom: 10px;
    }
    svg text { font-family: Georgia, 'Times New Roman', serif; }
  </style>
</head>
<body>
  <div class="chart-wrap">
    <p class="chart-title">Nenana Ice Classic: Breakup Dates, 1917–2025</p>
    <p class="chart-subtitle">Day the Tanana River ice breaks at Nenana, Alaska</p>
    <svg id="chart"></svg>
  </div>

  <script>
    const data = [
      {year:1917,doy:120},{year:1918,doy:130},{year:1919,doy:123},
      {year:1920,doy:131},{year:1921,doy:130},{year:1922,doy:131},
      {year:1923,doy:128},{year:1924,doy:131},{year:1925,doy:126},
      {year:1926,doy:113},{year:1927,doy:132},{year:1928,doy:126},
      {year:1929,doy:124},{year:1930,doy:127},{year:1931,doy:129},
      {year:1932,doy:122},{year:1933,doy:127},{year:1934,doy:120},
      {year:1935,doy:134},{year:1936,doy:121},{year:1937,doy:131},
      {year:1938,doy:125},{year:1939,doy:118},{year:1940,doy:111},
      {year:1941,doy:123},{year:1942,doy:120},{year:1943,doy:116},
      {year:1944,doy:124},{year:1945,doy:139},{year:1946,doy:124},
      {year:1947,doy:123},{year:1948,doy:133},{year:1949,doy:133},
      {year:1950,doy:125},{year:1951,doy:120},{year:1952,doy:132},
      {year:1953,doy:118},{year:1954,doy:125},{year:1955,doy:128},
      {year:1956,doy:122},{year:1957,doy:124},{year:1958,doy:118},
      {year:1959,doy:127},{year:1960,doy:123},{year:1961,doy:124},
      {year:1962,doy:131},{year:1963,doy:124},{year:1964,doy:140},
      {year:1965,doy:126},{year:1966,doy:127},{year:1967,doy:123},
      {year:1968,doy:128},{year:1969,doy:116},{year:1970,doy:123},
      {year:1971,doy:127},{year:1972,doy:130},{year:1973,doy:123},
      {year:1974,doy:125},{year:1975,doy:129},{year:1976,doy:123},
      {year:1977,doy:125},{year:1978,doy:120},{year:1979,doy:120},
      {year:1980,doy:119},{year:1981,doy:120},{year:1982,doy:129},
      {year:1983,doy:118},{year:1984,doy:129},{year:1985,doy:130},
      {year:1986,doy:127},{year:1987,doy:124},{year:1988,doy:116},
      {year:1989,doy:121},{year:1990,doy:112},{year:1991,doy:121},
      {year:1992,doy:135},{year:1993,doy:111},{year:1994,doy:118},
      {year:1995,doy:113},{year:1996,doy:125},{year:1997,doy:120},
      {year:1998,doy:110},{year:1999,doy:118},{year:2000,doy:122},
      {year:2001,doy:127},{year:2002,doy:126},{year:2003,doy:118},
      {year:2004,doy:113},{year:2005,doy:116},{year:2006,doy:122},
      {year:2007,doy:115},{year:2008,doy:126},{year:2009,doy:121},
      {year:2010,doy:118},{year:2011,doy:123},{year:2012,doy:112},
      {year:2013,doy:139},{year:2014,doy:112},{year:2015,doy:112},
      {year:2016,doy:112},{year:2017,doy:121},{year:2018,doy:121},
      {year:2019,doy:104},{year:2020,doy:116},{year:2021,doy:120},
      {year:2022,doy:122},{year:2023,doy:127},{year:2024,doy:116},
      {year:2025,doy:115}
    ];

    function loess(data, bandwidth) {
      const n = data.length;
      const k = Math.floor(bandwidth * n);
      return data.map(({year: x0}) => {
        const dists = data.map(d => Math.abs(d.year - x0));
        const sorted = [...dists].sort((a, b) => a - b);
        const h = sorted[k];
        const weights = dists.map(d => {
          const u = d / h;
          if (u >= 1) return 0;
          const v = 1 - u * u * u;
          return v * v * v;
        });
        const sw   = d3.sum(weights);
        const swx  = d3.sum(data, (d, i) => weights[i] * d.year);
        const swy  = d3.sum(data, (d, i) => weights[i] * d.doy);
        const swxx = d3.sum(data, (d, i) => weights[i] * d.year * d.year);
        const swxy = d3.sum(data, (d, i) => weights[i] * d.year * d.doy);
        const det  = sw * swxx - swx * swx;
        const b    = (sw * swxy - swx * swy) / det;
        const a    = (swy - b * swx) / sw;
        return { year: x0, doy: a + b * x0 };
      });
    }

    const smooth = loess(data, 0.3);

    const doyLabel = d => ({
      105:"Apr 15", 110:"Apr 20", 115:"Apr 25",
      120:"Apr 30", 125:"May 5", 130:"May 10",
      135:"May 15", 140:"May 20"
    }[d] || "");

    const totalW = Math.min(window.innerWidth - 32, 500);
    const totalH = totalW;
    const margin = { top: 12, right: 18, bottom: 56, left: 50 };
    const W = totalW - margin.left - margin.right;
    const H = totalH - margin.top - margin.bottom;

    const svg = d3.select("#chart")
      .attr("width", totalW)
      .attr("height", totalH)
      .append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    svg.append("rect")
      .attr("width", W).attr("height", H)
      .attr("fill", "#faf8f4").attr("rx", 2);

    // Scales — year on X, DoY on Y (inverted: earlier dates higher)
    const xScale = d3.scaleLinear().domain([1917, 2025]).range([0, W]);
    const yScale = d3.scaleLinear().domain([143, 101]).range([0, H]);

    // Gridlines
    svg.selectAll(".gx").data(d3.range(1920, 2030, 10)).enter().append("line")
      .attr("x1", d => xScale(d)).attr("x2", d => xScale(d))
      .attr("y1", 0).attr("y2", H)
      .attr("stroke", "#ddd8cf").attr("stroke-width", 0.8);

    svg.selectAll(".gy").data([105,110,115,120,125,130,135,140]).enter().append("line")
      .attr("x1", 0).attr("x2", W)
      .attr("y1", d => yScale(d)).attr("y2", d => yScale(d))
      .attr("stroke", "#ddd8cf").attr("stroke-width", 0.8);

    // Compute residual SD for shaded band
    const smoothMap = new Map(smooth.map(d => [d.year, d.doy]));
    const residuals = data.map(d => d.doy - smoothMap.get(d.year));
    const meanResid = d3.mean(residuals);
    const sd = Math.sqrt(d3.mean(residuals.map(r => (r - meanResid) ** 2)));

    // 1970 reference line
    svg.append("line")
      .attr("x1", xScale(1970)).attr("x2", xScale(1970))
      .attr("y1", 0).attr("y2", H)
      .attr("stroke", "#4488cc")
      .attr("stroke-width", 1.5)
      .attr("stroke-dasharray", "5,4")
      .attr("opacity", 0.85);

    // SD band
    const area = d3.area()
      .x(d => xScale(d.year))
      .y0(d => yScale(d.doy - sd))
      .y1(d => yScale(d.doy + sd))
      .curve(d3.curveCatmullRom.alpha(0.5));

    svg.append("path")
      .datum(smooth)
      .attr("fill", "#b85c1e")
      .attr("opacity", 0.15)
      .attr("d", area);

    // LOESS path
    const line = d3.line()
      .x(d => xScale(d.year))
      .y(d => yScale(d.doy))
      .curve(d3.curveCatmullRom.alpha(0.5));

    svg.append("path")
      .datum(smooth)
      .attr("fill", "none")
      .attr("stroke", "#b85c1e")
      .attr("stroke-width", 2.2)
      .attr("opacity", 0.9)
      .attr("d", line);

    // Data points
    svg.selectAll(".dot").data(data).enter().append("circle")
      .attr("cx", d => xScale(d.year))
      .attr("cy", d => yScale(d.doy))
      .attr("r", 6)
      .attr("fill", "#2e7d9a")
      .attr("opacity", 0.45)
      .attr("stroke", "#1d5c73")
      .attr("stroke-width", 0.4);

    // X Axis (years)
    svg.append("g")
      .attr("transform", `translate(0,${H})`)
      .call(d3.axisBottom(xScale)
        .tickValues(d3.range(1920, 2030, 10))
        .tickFormat(d3.format("d"))
        .tickSize(4))
      .call(g => g.select(".domain").attr("stroke","#8aada0"))
      .call(g => g.selectAll(".tick line").attr("stroke","#8aada0"))
      .call(g => g.selectAll("text")
        .style("font-size","9.5px").style("fill","#3a3a3a")
        .attr("transform","rotate(-38)").attr("dy","0.4em").attr("dx","-0.6em")
        .style("text-anchor","end"));

    // Y Axis (breakup date)
    svg.append("g")
      .call(d3.axisLeft(yScale)
        .tickValues([105,110,115,120,125,130,135,140])
        .tickFormat(doyLabel)
        .tickSize(4))
      .call(g => g.select(".domain").attr("stroke","#8aada0"))
      .call(g => g.selectAll(".tick line").attr("stroke","#8aada0"))
      .call(g => g.selectAll("text").style("font-size","9.5px").style("fill","#3a3a3a"));

    // Axis labels
    svg.append("text")
      .attr("x", W / 2).attr("y", H + 50)
      .attr("text-anchor","middle")
      .style("font-size","10.5px").style("fill","#2d4a3e")
      .text("Year");

    svg.append("text")
      .attr("transform","rotate(-90)")
      .attr("x", -H / 2).attr("y", -38)
      .attr("text-anchor","middle")
      .style("font-size","10.5px").style("fill","#2d4a3e")
      .text("Breakup Date");
  </script>
</body>
</html>
